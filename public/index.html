<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پیام‌رسان خصوصی</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="auth-page" class="page">
    <div class="auth-box">
      <h1>پیام‌رسان خصوصی</h1>
      <div class="tabs">
        <button id="tab-login" class="active">ورود</button>
        <button id="tab-register">ثبت‌نام</button>
      </div>
      <form id="login-form">
        <input type="text" id="login-phone" placeholder="شماره موبایل (مثال: 0912...)" required />
        <input type="password" id="login-password" placeholder="رمز عبور" required />
        <button type="submit">ورود</button>
      </form>
      <form id="register-form" class="hidden">
        <input type="text" id="reg-name" placeholder="نام نمایشی" required />
        <input type="text" id="reg-phone" placeholder="شماره موبایل" required />
        <input type="password" id="reg-password" placeholder="رمز عبور" required />
        <button type="submit">ثبت‌نام</button>
      </form>
      <p id="auth-error" class="error"></p>
      <p class="hint">برای دسترسی ادمین با شماره <b>09940355222</b> ثبت‌نام کنید</p>
    </div>
  </div>

  <div id="chat-page" class="page hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <strong id="my-name"></strong>
          <small id="my-phone"></small>
        </div>
        <div class="header-actions">
          <button id="btn-admin" class="hidden" title="پنل ادمین">👑</button>
          <button id="btn-logout" title="خروج">خروج</button>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="search-user" placeholder="جستجوی کاربر برای شروع چت..." />
        <div id="user-list" class="user-list"></div>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </aside>
    <main class="chat-area">
      <div id="no-chat" class="no-chat">
        <p>یک گفتگو انتخاب کنید یا کاربر جدیدی پیدا کنید</p>
      </div>
      <div id="active-chat" class="hidden">
        <div class="chat-header">
          <strong id="chat-with-name"></strong>
          <small id="chat-with-phone"></small>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
          <label class="file-btn" title="ارسال فایل یا ویس">
            📎
            <input type="file" id="file-input" accept="*/*" hidden />
          </label>
          <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." autocomplete="off" />
          <button id="btn-send">ارسال</button>
        </div>
      </div>
    </main>
  </div>

  <div id="admin-page" class="page hidden">
    <div class="admin-header">
      <h2>پنل ادمین – همه گفتگوها</h2>
      <button id="btn-back-chat">بازگشت به چت</button>
    </div>
    <div id="admin-chats" class="admin-chats"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
